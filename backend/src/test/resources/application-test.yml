# Perfil de testes de integração. Banco definido por IntegrationTest (Testcontainers ou externo).
app:
  events:
    executor:
      core-size: 4
      max-size: 4
  jobs:
    concurrency: 4
  base-url: http://localhost
  http:
    # nos ITs a conexão vem de 127.0.0.1 e faz o papel do ALB (proxy confiável)
    trusted-proxies: 127.0.0.1/32,::1/128
  logging:
    dir: ./target/test-logs
    technical-level: INFO
  public-api:
    token-hash-keys:
      t1: dGVzdC1vbmx5LXB1YmxpYy1hcGktdG9rZW4taGFzaC1rZXkh
  crypto:
    keys:
      k1: dGVzdC1vbmx5LWFlcy1rZXktMzItYnl0ZXMtLS0tLSE=
    active-key-id: k1
    blind-index-key: dGVzdC1vbmx5LWJsaW5kLWluZGV4LWtleS0zMi1ieXRlcyE=
  communication:
    sandbox:
      enabled: true
  payment:
    sandbox:
      enabled: true
    # testes nunca acessam a rede: URL pública local (a conta sandbox não faz chamadas HTTP)
    webhook:
      public-base-url: http://127.0.0.1:9
    # testes nunca acessam a rede: endereço local sem serviço falha de imediato (conexão recusada)
    whatsapp:
      api-base-url: http://127.0.0.1:9
      connect-timeout: PT1S
      read-timeout: PT1S
  portal:
    access:
      # o limite por minuto por IP é testado em unidade; nos ITs todas as requisições vêm de 127.0.0.1
      requests-per-minute-per-ip: 100000
      min-response-time: PT0.05S
  assistant:
    sandbox:
      enabled: true
  helpdesk:
    sandbox:
      enabled: true
    # testes nunca acessam o GitHub: sem token (abertura indisponível) e endereço local sem serviço; os ITs de
    # chamado substituem o rastreador por um dublê
    github:
      token: ""
      api-base-url: http://127.0.0.1:9
  telephony:
    # testes conduzem os eventos de chamada explicitamente (sem andamento automático nem rede)
    sandbox:
      enabled: true
      auto-progress: false
    # ambiente multiprovedor nos testes: a Alvaria (contrato a confirmar) disca contra um servidor HTTP local
    homologation:
      providers: ALVARIA
    alvaria:
      allowed-host-suffixes: 127.0.0.1
      allow-insecure-http: true
      connect-timeout: PT1S
      read-timeout: PT2S
    # Twilio e Plivo contra o servidor HTTP local da execução (FakeHttpApi; endereço no IntegrationTest)
    twilio:
      allowed-hosts: 127.0.0.1
      allow-insecure-http: true
      connect-timeout: PT1S
      read-timeout: PT2S
    plivo:
      allowed-hosts: 127.0.0.1
      recording-hosts: 127.0.0.1
      allow-insecure-http: true
      connect-timeout: PT1S
      read-timeout: PT2S
    webhook:
      # endereço público fictício: as assinaturas da Twilio/Plivo nos testes cobrem esta base
      public-base-url: https://gestor.teste
  storage:
    provider: filesystem
    local-root: ./target/test-storage
  scheduling:
    enabled: false
  analytics:
    # testes atualizam os painéis explicitamente, várias vezes seguidas
    manual-refresh-min-interval: PT0S
  security:
    cookie-secure: false
    jwt:
      private-key: classpath:it/jwt-private.pem
      public-key: classpath:it/jwt-public.pem

spring:
  # Cada contexto de teste tem banco e pool próprios e vários contextos ficam vivos no cache do Spring.
  # O pool acompanha a concorrência configurada abaixo (4 consumidores de eventos + 4 workers de jobs,
  # cada um podendo segurar duas conexões em transações aninhadas, + requisições do teste) e encolhe
  # para 1 conexão quando o contexto fica ocioso.
  datasource:
    hikari:
      maximum-pool-size: 18
      minimum-idle: 1
      idle-timeout: 10000
  mail:
    host: localhost
    port: 2525
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
