# =============================================================================
# Configuração base. Valores sensíveis SEMPRE por variável de ambiente.
# Perfis: local (desenvolvimento), test (testes automatizados), prod (AWS).
# =============================================================================
spring:
  application:
    name: gestor-cobranca
  profiles:
    default: local

  datasource:
    # Aplicação conecta com o papel app_runtime (sem BYPASSRLS, não-dono das tabelas)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobranca}
    username: ${DB_USERNAME:app_runtime_login}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: app-pool
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1500000
      leak-detection-threshold: 60000
      data-source-properties:
        ApplicationName: gestor-cobranca
        reWriteBatchedInserts: true

  flyway:
    # Migrations executadas com o papel dono do schema (separado do runtime)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobranca}
    user: ${DB_MIGRATION_USERNAME:cobranca}
    password: ${DB_MIGRATION_PASSWORD:}
    locations: classpath:db/migration
    default-schema: shared
    create-schemas: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

  mvc:
    problemdetails:
      enabled: true

  modulith:
    # Moments não é usado; a autoconfiguração dele ativa @EnableScheduling por conta própria e
    # anularia app.scheduling.enabled (agendamento é controlado só por SchedulingConfig)
    moments:
      enabled: false
    events:
      republish-outstanding-events-on-restart: false
      completion-mode: update

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  # O ALB repassa X-Forwarded-For/Proto; as instâncias só aceitam tráfego do ALB (security group)
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      tracking-modes: []
  tomcat:
    max-swallow-size: 105MB
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        jobs.duration: 0.5,0.95,0.99
      slo:
        http.server.requests: 200ms,500ms,1s,2s
  cloudwatch:
    metrics:
      export:
        enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
        namespace: GestorCobranca
        step: 1m
  info:
    build:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

# -----------------------------------------------------------------------------
# Configurações da aplicação
# -----------------------------------------------------------------------------
app:
  environment: ${APP_ENV:local}
  base-url: ${APP_BASE_URL:http://localhost:4200}

  logging:
    dir: ${LOG_DIR:./var/log}
    technical-level: ${LOG_LEVEL:INFO}

  crypto:
    # Chaves AES-256 (Base64, 32 bytes). Formato: APP_CRYPTO_KEYS_<ID>; ver docs/tecnico/seguranca.md
    keys:
      k1: ${APP_CRYPTO_KEY_K1:}
    active-key-id: ${APP_CRYPTO_ACTIVE_KEY_ID:k1}
    blind-index-key: ${APP_CRYPTO_BLIND_INDEX_KEY:}

  storage:
    provider: ${STORAGE_PROVIDER:s3}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:sa-east-1}
    kms-key-id: ${S3_KMS_KEY_ID:}

  security:
    jwt:
      issuer: ${JWT_ISSUER:https://gestorcobranca.com.br}
      # Par RSA (PEM PKCS#8 / X.509). Em produção: variáveis de ambiente injetadas no deploy.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}
      access-token-ttl: PT10M
      mfa-token-ttl: PT5M
    session:
      refresh-token-ttl: PT12H
      idle-timeout: PT30M
      max-sessions-per-user: 3
    password:
      min-length: 12
      history: 5
      max-age: P90D
    lockout:
      max-failed-attempts: 5
      base-lock-duration: PT5M
      max-lock-duration: PT1H
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit:
      login-per-minute-per-ip: 20
    mfa:
      issuer: Gestor de Cobranca
      required-for-roles: ADMIN,GESTOR,FINANCEIRO,AUDITOR,JURIDICO,ADVOGADO_PARCEIRO

  audit:
    seal-interval: PT1M

  events:
    republish-interval: PT1M
    republish-min-age: PT2M

  jobs:
    concurrency: ${JOBS_CONCURRENCY:8}
    poll-interval: PT1S
    lease: PT15M

  scheduling:
    enabled: true

  debt:
    prescription:
      # reconciliação e alerta de prescrição próxima (janela por regra, em debt.prescription_rule)
      daily-cron: "0 10 6 * * *"
      batch-size: 500
      recalculation-batch: 200
    evidence:
      max-size-bytes: 20971520

  compliance:
    data-subject-request:
      # dias corridos para atender (LGPD art. 19, II); prazos específicos por tipo em due-days
      default-due-days: 15
      overdue-check-interval: PT30M
    retention:
      cron: "0 30 2 * * *"
      batch-size: 200
      stale-run-after: PT6H
      expiry-check-interval: PT5M
    evidence:
      max-size-bytes: 20971520

  analytics:
    # atualização dos snapshots dos painéis (carimbo "dados até")
    refresh-interval: PT15M
    refresh-initial-delay: PT1M
    refresh-statement-timeout: PT10M
    manual-refresh-min-interval: PT2M
    # consulta de painel acima disto conta em analytics.queries.slow
    slow-query-threshold: PT2S
    export-max-rows: 100000
  incentive:
    # ajuste manual de extrato acima deste valor (absoluto) exige segunda aprovação
    dual-approval-threshold: 500.00
    # fecha automaticamente o período quando termina a carência do último dia
    auto-close: true
    default-grace-business-days: 5
    daily-cron: "0 20 3 * * *"
    logged-time-sync-interval: PT1H
    posting-sweep-interval: PT15M
    posting-sweep-min-age: PT10M

  communication:
    # tentativas do job de envio (falhas transitórias do provedor) antes de FAILED/DEAD
    send-max-attempts: 6
    # descarte diário do conteúdo de mensagens (política MESSAGE_CONTENT do compliance)
    retention-cron: "0 40 2 * * *"
    retention-batch: 500
    webhook:
      max-body-bytes: 262144
      requests-per-minute: 600
      # janela de replay: eventos mais antigos são descartados; recibos guardados por este prazo
      max-event-age: P7D
      max-clock-skew: PT5M
    whatsapp:
      api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
      connect-timeout: PT3S
      read-timeout: PT10S
    # provedor simulado: somente local/teste (recusado no perfil prod)
    sandbox:
      enabled: false
      delivery-delay: PT0S
    # varredura de estouros do SLA de primeira resposta (metas por canal: /api/v1/communication/response-targets)
    sla-scan-interval: PT1M
    # tempo real da caixa de entrada: SSE por instância + LISTEN/NOTIFY do PostgreSQL entre instâncias
    realtime:
      enabled: true
      heartbeat: PT20S
      max-stream-duration: PT5M
      max-streams-per-user: 5
      max-streams: 2000
      reconnect-delay: PT5S
      revalidation: PT1M

  payment:
    # padrões da assessoria enquanto ela não grava os seus (PUT /api/v1/payment/settings)
    defaults:
      # pagamento externo acima deste valor exige aprovação de outra pessoa com PAYMENT_REVIEW
      external-review-threshold: 500.00
      pix-expiration-seconds: 86400
      pix-due-validity-days: 30
      reconciliation-date-tolerance-days: 3
    webhook:
      # URL pública (ALB) informada ao PSP: <public-base-url>/api/v1/webhooks/pix/<routingKey>
      public-base-url: ${PAYMENT_WEBHOOK_PUBLIC_BASE_URL:${APP_BASE_URL:http://localhost:8080}}
      max-body-bytes: 262144
      requests-per-minute: 600
      # janela de replay: notificações mais antigas são descartadas; recibos guardados por este prazo
      max-event-age: P7D
      max-clock-skew: PT5M
      # ALB com mutual TLS em modo verify repassa o certificado do PSP neste cabeçalho
      client-certificate-header: X-Amzn-Mtls-Clientcert-Leaf
    pix:
      connect-timeout: PT3S
      read-timeout: PT10S
      token-refresh-margin: PT60S
    evidence:
      max-size-bytes: 10485760
    statement:
      max-size-bytes: 10485760
      max-lines: 50000
    expiration-check-interval: PT15M
    # PSP simulado: somente local/teste (recusado no perfil prod)
    sandbox:
      enabled: false

  portal:
    # endereço público usado nos links enviados ao devedor: <base>/portal/<slug>/entrar#<token>
    public-base-url: ${PORTAL_PUBLIC_BASE_URL:${APP_BASE_URL:https://localhost:8443}}
    session:
      token-ttl: PT10M
      idle-timeout: PT15M
      absolute-timeout: PT60M
      max-active-per-debtor: 3
    access:
      code-ttl: PT10M
      code-max-attempts: 5
      knowledge-ttl: PT10M
      requests-per-minute-per-ip: 20
      # bloqueio progressivo (persistido) por documento e por IP: 15 min, dobrando até 24 h
      window: PT30M
      document-max-failures: 5
      document-max-requests: 3
      ip-max-failures: 20
      ip-max-requests: 15
      base-lock: PT15M
      max-lock: PT24H
      # equaliza o tempo de resposta do pedido de código (documento existente × inexistente)
      min-response-time: PT0.4S
    # templates do communication (sufixo = canal: _WHATSAPP, _SMS, _EMAIL)
    templates:
      access-code: PORTAL_CODIGO
      access-link: PORTAL_LINK
      service-request: PORTAL_ATENDIMENTO
    session-expiry-interval: PT10M
  telephony:
    # tentativas do job de discagem (falhas transitórias do provedor) antes de FAILED
    dial-max-attempts: 3
    # prazo do pós-atendimento: sem tabulação do operador, a chamada é tabulada automaticamente
    tabulation-deadline: PT15M
    # operador sem sinal do cliente (heartbeat) além deste prazo sai automaticamente
    presence-timeout: PT90S
    # chamada em andamento sem evento do provedor além deste prazo é encerrada (conciliação)
    stale-call-after: PT4H
    # descarte diário de gravações (política CALL_RECORDINGS do compliance)
    retention-cron: "0 50 2 * * *"
    retention-batch: 200
    recording-max-bytes: 209715200
    dialer:
      tick-interval: PT3S
      max-per-tick: 50
      load-page-size: 200
      max-entries: 50000
    webhook:
      max-body-bytes: 65536
      requests-per-minute: 1200
      # janela de replay: eventos mais antigos são descartados; recibos guardados por este prazo
      max-event-age: P2D
      # tolerância do instante assinado e de eventos no futuro
      max-clock-skew: PT5M
    # provedor simulado: somente local/teste (recusado no perfil prod); provedor real na issue #12
    sandbox:
      enabled: false
      auto-progress: true

  assistant:
    # mensagens mais recentes da conversa enviadas ao modelo (texto minimizado)
    history-messages: 12
    # tentativas do job de turno (falha de infraestrutura; falha do modelo transfere para humano sem repetir)
    turn-max-attempts: 3
    # turno sem conclusão além deste prazo é recuperado (instância caiu): registra falha e transfere
    stale-turn-after: PT10M
    # janela da quebra precoce nas métricas de qualidade (acordos do assistente × humanos)
    early-break-days: 60
    # descarte diário do conteúdo da trilha (política MESSAGE_CONTENT do compliance)
    retention-cron: "0 55 2 * * *"
    retention-batch: 500
    # modelo simulado determinístico: somente local/teste (recusado no perfil prod); provedor real na issue #12
    sandbox:
      enabled: false

  collection:
    # padrões da operação enquanto a assessoria não grava os seus (PUT /api/v1/collection/settings)
    defaults:
      promise-tolerance-days: 2
      promise-max-days: 30
      callback-tolerance-minutes: 30
      dispute-response-days: 10
    # vencimento de retornos (tolerância) e quebra de promessas / prazo de contestações
    callback-check-interval: PT5M
    daily-cron: "0 10 0 * * *"
    # casos processados por job de sincronização/roteamento/recálculo
    batch-size: 200
    evidence:
      max-size-bytes: 20971520
  settlement:
    # ajuste de demonstrativo acima deste valor (absoluto) exige segunda aprovação (SETTLEMENT_APPROVE)
    adjustment-dual-approval-threshold: 1000.00
    # comprovante de repasse (PDF, PNG ou JPEG)
    evidence-max-size-bytes: 10485760
  legal:
    # varredura diária: vencimentos, alertas e prazos perdidos, indicação pelas regras, captura automática
    daily-cron: "0 40 5 * * *"
    batch-size: 200
    max-referrals-per-run: 500
    # padrões conservadores enquanto a assessoria não grava os seus (PUT /api/v1/legal/settings);
    # decisões pendentes da issue #14: quem conduz, quem adianta custas, dívidas prescritas
    defaults:
      conduct-model: INTERNAL_ONLY
      allowed-expense-advancers: CREDITOR
      budget-enforcement: BLOCK
      prescribed-title-policy: EXCLUDE
      collection-hold-stage: AUTHORIZATION
      deadline-alert-levels: 5,2,0
      year-end-recess: true
      removal-deadline-business-days: 5
      homologation-deadline-business-days: 5
      credit-bureau-notice-days: 10
      prescription-warning-days: 180
      referral-cooldown-days: 180
    # adaptador de cada integração: "manual" até a aprovação (issues #13 e #14); ver docs/tecnico/desenho/juridico.md §B.4
    providers:
      court-data: manual
      publications: manual
      protest: manual
      credit-bureau: manual
      real-estate-registry: manual
      vehicle-lien: manual
    documents:
      max-size-bytes: 20971520
  # Ingestão de carteiras (limites contra arquivos maliciosos; ver IngestionProperties)
  ingestion:
    max-file-size: 50MB
    max-rows: 1000000
    max-api-records: 1000
    block-size: 500
    slice-duration: PT2M
    max-issues-per-batch: 50000
    xlsx-max-uncompressed-size: 1GB
    xlsx-max-shared-strings-size: 100MB
    xlsx-max-entries: 1000
    xlsx-max-compression-ratio: 100
