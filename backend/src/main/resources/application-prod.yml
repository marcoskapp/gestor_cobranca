# Produção (AWS). Todos os valores sensíveis chegam por variáveis de ambiente/arquivos
# provisionados pelo user-data da instância (ver infra/terraform e scripts/instance).
spring:
  flyway:
    # As instâncias de aplicação NÃO executam migrations: elas rodam uma vez por implantação
    # com --app.mode=migrate e o papel dono do schema (scripts/deploy/migrate.sh).
    enabled: ${SPRING_FLYWAY_ENABLED:false}

server:
  # o ALB encerra TLS e repassa X-Forwarded-*; só o TrustedProxyFilter os interpreta, e apenas para
  # conexões vindas das sub-redes do ALB (APP_HTTP_TRUSTED_PROXIES, obrigatório em produção)
  forward-headers-strategy: none

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  cloudwatch:
    metrics:
      export:
        enabled: ${CLOUDWATCH_METRICS_ENABLED:true}

app:
  logging:
    dir: ${LOG_DIR:/var/log/gestor-cobranca}
    technical-level: ${LOG_LEVEL:INFO}
  security:
    cookie-secure: true
    jwt:
      private-key: ${APP_SECURITY_JWT_PRIVATE_KEY:file:/etc/gestor-cobranca/jwt-private.pem}
      public-key: ${APP_SECURITY_JWT_PUBLIC_KEY:file:/etc/gestor-cobranca/jwt-public.pem}
