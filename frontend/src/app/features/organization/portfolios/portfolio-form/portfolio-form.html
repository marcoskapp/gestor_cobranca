<div class="modal-header">
  <h2 appDialogTitle class="h5 mb-0">{{ editing ? 'Editar carteira' : 'Nova carteira' }}</h2>
  <button type="button" class="btn-close" aria-label="Cancelar" appDialogClose></button>
</div>
<form class="d-flex flex-column overflow-hidden" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="modal-body">
    @for (e of generalErrors(); track e) {
      <div class="alert alert-danger d-flex align-items-start gap-2" role="alert"><app-icon name="exclamation-circle" /><span>{{ e }}</span></div>
    }
    <div class="app-form-grid row-gap-3">
      <div class="app-span-all">
        <app-entity-picker [control]="form.controls.creditor" [source]="creditors" label="Credor" [single]="true" />
        @if (form.controls.creditor.invalid && form.controls.creditor.touched) {
          <div class="invalid-feedback d-block" role="alert">Selecione o credor.</div>
        }
      </div>
      <app-field
        class="app-span-all"
        label="Contrato"
        [hint]="!editing && !contractsLoading() && form.controls.creditor.value.length > 0 && activeContracts().length === 0 ? 'Este credor não tem contrato vigente. Cadastre um contrato antes da carteira.' : ''"
        [error]="message('contractId')"
      >
        <select appInput formControlName="contractId">
          <option value="" disabled>Selecione</option>
          @for (k of activeContracts(); track k.id) {
            <option [ngValue]="k.id">{{ k.number }}</option>
          }
        </select>
      </app-field>
      <app-field label="Código" [error]="message('code')">
        <input appInput formControlName="code" class="font-monospace" [maxlength]="limits.portfolioCode" />
      </app-field>
      <app-field label="Nome" [error]="message('name')">
        <input appInput formControlName="name" [maxlength]="limits.portfolioName" [attr.ngbAutofocus]="editing ? '' : null" />
      </app-field>
      <app-field label="Recebida em" [error]="message('receivedOn')">
        <div class="input-group">
          <input appInput formControlName="receivedOn" ngbDatepicker #received="ngbDatepicker" placeholder="dd/mm/aaaa" autocomplete="off" />
          <button class="btn btn-outline-secondary" type="button" (click)="received.toggle()" aria-label="Abrir calendário da data de recebimento">
            <app-icon name="calendar-event" />
          </button>
        </div>
      </app-field>
      <app-field label="Válida até" hint="Opcional" [error]="message('validUntil')">
        <div class="input-group">
          <input appInput formControlName="validUntil" ngbDatepicker #valid="ngbDatepicker" placeholder="dd/mm/aaaa" autocomplete="off" />
          <button class="btn btn-outline-secondary" type="button" (click)="valid.toggle()" aria-label="Abrir calendário da data de validade">
            <app-icon name="calendar-event" />
          </button>
        </div>
      </app-field>
      <app-field class="app-span-all" label="Descrição" [error]="message('description')">
        <textarea appInput formControlName="description" rows="3" [maxlength]="limits.portfolioDescription"></textarea>
      </app-field>
    </div>
    @if (form.hasError('dateRange')) {
      <div class="invalid-feedback d-block mt-2" role="alert">A validade não pode ser anterior ao recebimento.</div>
    }
  </div>
  <div class="modal-footer">
    <button class="btn btn-link" type="button" appDialogClose>Cancelar</button>
    <button class="btn btn-primary" type="submit" [disabled]="saving()">{{ editing ? 'Salvar' : 'Cadastrar carteira' }}</button>
  </div>
</form>
