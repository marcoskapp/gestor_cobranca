<app-page-header
  title="Log de acesso"
  subtitle="Eventos de autenticação, sessão, negação de acesso e visualização de dados sensíveis."
/>

<form class="app-filters" data-tour="filters" [formGroup]="filters" (ngSubmit)="apply()" role="search" aria-label="Filtrar log de acesso">
  <app-field label="De">
    <div class="input-group">
      <input appInput formControlName="from" ngbDatepicker #from="ngbDatepicker" container="body" placeholder="dd/mm/aaaa" autocomplete="off" />
      <button class="btn btn-outline-secondary" type="button" (click)="from.toggle()" aria-label="Abrir calendário: De">
        <app-icon name="calendar-event" />
      </button>
    </div>
  </app-field>
  <app-field label="Até">
    <div class="input-group">
      <input appInput formControlName="to" ngbDatepicker #to="ngbDatepicker" container="body" placeholder="dd/mm/aaaa" autocomplete="off" />
      <button class="btn btn-outline-secondary" type="button" (click)="to.toggle()" aria-label="Abrir calendário: Até">
        <app-icon name="calendar-event" />
      </button>
    </div>
  </app-field>
  <app-field label="Evento">
    <select appInput formControlName="eventType">
      <option value="">Todos</option>
      @for (t of eventTypes; track t.value) {
        <option [ngValue]="t.value">{{ t.label }}</option>
      }
    </select>
  </app-field>
  <app-field label="Resultado">
    <select appInput formControlName="success">
      <option value="">Todos</option>
      <option value="true">Sucesso</option>
      <option value="false">Falha</option>
    </select>
  </app-field>
  <app-field label="IP">
    <input appInput formControlName="clientIp" maxlength="45" />
  </app-field>
  <div class="app-filters__wide">
    <app-entity-picker [control]="filters.controls.actor" [source]="users" label="Usuário" [single]="true" />
  </div>
  <div class="app-filters__actions">
    <button class="btn btn-primary" type="submit">Filtrar</button>
    <button class="btn btn-link" type="button" (click)="clear()">Limpar</button>
  </div>
  @if (filters.hasError('dateRange')) {
    <div class="invalid-feedback d-block w-100" role="alert">A data final não pode ser anterior à inicial.</div>
  }
</form>

<app-data-table
  caption="Log de acesso"
  [rows]="query.rows()"
  [columns]="columns"
  [loading]="query.loading()"
  [failed]="query.failed()"
  [page]="query.tablePage()"
  (pageChange)="query.setPage($event)"
  (retry)="query.reload()"
  emptyMessage="Nenhum evento encontrado no período."
>
  <ng-template appCell="occurredAt" [appCellOf]="query.rows()" let-e>{{ e.occurredAt | appDate }}</ng-template>
  <ng-template appCell="eventType" [appCellOf]="query.rows()" let-e>{{ eventLabel(e.eventType) }}</ng-template>
  <ng-template appCell="success" [appCellOf]="query.rows()" let-e>
    <span class="app-status" [class.app-status--success]="e.success" [class.app-status--danger]="!e.success">
      {{ e.success ? 'Sucesso' : 'Falha' }}
    </span>
  </ng-template>
  <ng-template appCell="actor" [appCellOf]="query.rows()" let-e>{{ actor(e) }}</ng-template>
  <ng-template appCell="route" [appCellOf]="query.rows()" let-e><span class="app-mono">{{ e.route ?? '—' }}</span></ng-template>
  <ng-template appCell="actions" [appCellOf]="query.rows()" let-e>
    <button class="btn btn-sm btn-outline-secondary border-0"
      type="button"
      (click)="details(e)"
      [attr.aria-label]="'Detalhes do evento de ' + (e.occurredAt | appDate)"
      ngbTooltip="Detalhes"
    >
      <app-icon name="box-arrow-up-right" />
    </button>
  </ng-template>
</app-data-table>
