<h1 class="app-auth-title">Entrar</h1>

@if (notice(); as n) {
  <div class="alert alert-info" role="status">{{ n }}</div>
}
@if (error(); as e) {
  <div class="alert alert-danger" role="alert">{{ e }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="app-form-stack">
  <app-field label="Assessoria" hint="Identificador da sua assessoria (ex.: minha-assessoria)">
    <input
      appInput
      formControlName="tenant"
      autocomplete="organization"
      autocapitalize="off"
      spellcheck="false"
      [maxlength]="limits.tenantSlug"
    />
  </app-field>

  <app-field label="E-mail">
    <input appInput type="email" formControlName="email" autocomplete="username" [maxlength]="limits.email" />
  </app-field>

  <app-password-field [control]="form.controls.password" label="Senha" autocomplete="current-password" />

  <button type="submit" class="btn btn-primary w-100 mt-2" [disabled]="submitting()">
    @if (submitting()) {
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
    }
    Entrar
  </button>
</form>

<p class="app-auth-links">
  <a routerLink="/esqueci-a-senha">Esqueci minha senha</a>
</p>
