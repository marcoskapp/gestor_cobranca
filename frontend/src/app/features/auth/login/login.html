<h1 class="app-auth-title">Entrar</h1>

@if (notice(); as n) {
  <p class="app-alert app-alert--info" role="status">{{ n }}</p>
}
@if (error(); as e) {
  <p class="app-alert app-alert--error" role="alert">{{ e }}</p>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="app-form-stack">
  <mat-form-field>
    <mat-label>Assessoria</mat-label>
    <input
      matInput
      formControlName="tenant"
      autocomplete="organization"
      autocapitalize="off"
      spellcheck="false"
      [maxlength]="limits.tenantSlug"
    />
    <mat-hint>Identificador da sua assessoria (ex.: minha-assessoria)</mat-hint>
    @if (form.controls.tenant.invalid) {
      <mat-error>{{ message('tenant') }}</mat-error>
    }
  </mat-form-field>

  <mat-form-field>
    <mat-label>E-mail</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="username" [maxlength]="limits.email" />
    @if (form.controls.email.invalid) {
      <mat-error>{{ message('email') }}</mat-error>
    }
  </mat-form-field>

  <app-password-field [control]="form.controls.password" label="Senha" autocomplete="current-password" />

  <button mat-flat-button type="submit" class="app-full-width" [disabled]="submitting()">
    @if (submitting()) {
      <mat-progress-spinner diameter="18" mode="indeterminate" aria-hidden="true" class="app-button-spinner" />
    }
    Entrar
  </button>
</form>

<p class="app-auth-links">
  <a routerLink="/esqueci-a-senha">Esqueci minha senha</a>
</p>
