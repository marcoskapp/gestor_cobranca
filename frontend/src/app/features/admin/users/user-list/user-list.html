<app-page-header title="Usuários" subtitle="Contas de acesso da assessoria, perfis e escopo de credores.">
  <button class="btn btn-primary" type="button" *appHasPermission="permission.USER_MANAGE" (click)="create()">
    <app-icon name="person-plus" />
    Novo usuário
  </button>
</app-page-header>

<form class="app-filters" data-tour="filters" [formGroup]="filters" role="search" aria-label="Filtrar usuários" (ngSubmit)="query.reload()">
  <app-field class="app-filters__wide" label="Nome ou e-mail">
  <div class="input-group">
    <input appInput formControlName="q" type="search" />
    <span class="input-group-text" aria-hidden="true"><app-icon name="search" /></span>
  </div>
  </app-field>
  <app-field label="Situação">
    <select appInput formControlName="status">
      <option value="">Todas</option>
      @for (s of statuses; track s.value) {
        <option [ngValue]="s.value">{{ s.label }}</option>
      }
    </select>
  </app-field>
  <app-field label="Perfil">
    <select appInput formControlName="roleId">
      <option value="">Todos</option>
      @for (r of roles(); track r.id) {
        <option [ngValue]="r.id">{{ r.name }}</option>
      }
    </select>
  </app-field>
  <div class="app-filters__actions">
    <button class="btn btn-link" type="button" (click)="clearFilters()">Limpar filtros</button>
  </div>
</form>

<app-data-table
  caption="Usuários"
  [rows]="query.rows()"
  [columns]="columns"
  [loading]="query.loading()"
  [failed]="query.failed()"
  [page]="query.tablePage()"
  (pageChange)="query.setPage($event)"
  (retry)="query.reload()"
  emptyMessage="Nenhum usuário encontrado com os filtros informados."
>
  <ng-template appCell="name" [appCellOf]="query.rows()" let-u>
    <a [routerLink]="['/admin/usuarios', u.id]">{{ u.name }}</a>
  </ng-template>
  <ng-template appCell="roles" [appCellOf]="query.rows()" let-u>{{ rolesOf(u) }}</ng-template>
  <ng-template appCell="status" [appCellOf]="query.rows()" let-u>
    <app-status-chip domain="user" [status]="u.status" />
    @if (u.locked) {
      <span class="app-status app-status--danger ms-1">Bloqueado</span>
    }
  </ng-template>
  <ng-template appCell="mfa" [appCellOf]="query.rows()" let-u>
    @if (u.mfaEnabled) {
      <app-icon label="MFA ativo" ngbTooltip="MFA ativo" name="shield-check" />
    } @else {
      <span class="app-muted" aria-label="MFA inativo">—</span>
    }
  </ng-template>
  <ng-template appCell="lastLoginAt" [appCellOf]="query.rows()" let-u>{{ u.lastLoginAt | appDate }}</ng-template>
  <ng-template appCell="actions" [appCellOf]="query.rows()" let-u>
    <a class="btn btn-sm btn-outline-secondary border-0" [routerLink]="['/admin/usuarios', u.id]" [attr.aria-label]="'Abrir ' + u.name" ngbTooltip="Abrir">
      <app-icon name="chevron-right" />
    </a>
  </ng-template>
</app-data-table>
