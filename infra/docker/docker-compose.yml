# Ambiente local de desenvolvimento: PostgreSQL 16 com os papéis de produção e
# Mailpit para capturar e-mails (interface em http://localhost:8025).
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Credenciais abaixo são exclusivas de desenvolvimento.
name: gestor-cobranca

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cobranca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ../../scripts/db/bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cobranca"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
